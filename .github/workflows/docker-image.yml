name: Docker Image CI

on:
  push:
    branches: ["uc"]
  pull_request:
    branches: ["uc"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Login to ECR
        id: ecr
        uses: jwalton/gh-ecr-login@v1
        with:
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: us-east-1
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag uploadkit/imagor-alt:latest
      - name: Push to ECR
        run: |
          docker tag uploadkit/imagor-alt:latest ${{ steps.ecr.outputs.account }}.dkr.ecr.us-east-1.amazonaws.com/uploadkit/imagor-alt:latest
          docker push ${{ steps.ecr.outputs.account }}.dkr.ecr.us-east-1.amazonaws.com/uploadkit/imagor-alt:latest
